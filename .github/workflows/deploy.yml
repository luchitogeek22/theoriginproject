name: Deploy to Production

# Runs after "CI Code Protection" finishes, and deploys only when that run
# succeeded, came from a push, and belongs to this repository.
#
# The `branches` filter below compares the name of the head branch, so a pull
# request from a fork whose branch is called "main" also matches it. The job
# conditions are what keep fork code away from the secrets used here.
on:
  workflow_run:
    workflows: ["CI Code Protection"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: deploy-frontend (Vercel)
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    # NOTE: steps run from the repo root on purpose. The Vercel project has
    # Root Directory = frontend, and the CLI appends it to the cwd — running
    # from frontend/ would resolve the duplicated path frontend/frontend.
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # The Vercel CLI reads the token from this variable, which keeps it out
      # of the process arguments.
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix frontend
      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production
      - name: Build for production
        run: npx vercel build --prod
      - name: Deploy to Vercel
        # Remote build on Vercel infra (respects the dashboard Root Directory
        # natively). The local `vercel build` above stays as a fast CI gate.
        run: npx vercel deploy --prod

  deploy-database:
    name: deploy-database (Supabase)
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      # Supavisor pooler in session mode (port 5432): reachable over IPv4
      # from GitHub runners (the direct db.* host is IPv6-only) and safe
      # for DDL, unlike transaction mode (6543). Password lives only in
      # repository secrets. Region us-east-1 per the project's own DNS;
      # confirm the exact host in Supabase Dashboard > Database settings.
      SUPABASE_DB_URL: postgresql://postgres.lgdxwbarmsmootifbcsp:${{ secrets.SUPABASE_DB_PASSWORD }}@aws-0-us-east-1.pooler.supabase.com:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: supabase/setup-cli@v1
      - name: Check database connectivity
        run: psql "$SUPABASE_DB_URL" -c "select version();"
      - name: Apply pending migrations
        # Runs once the team adds SQL files under supabase/migrations/.
        if: hashFiles('supabase/migrations/*.sql') != ''
        run: supabase db push --db-url "$SUPABASE_DB_URL"
