name: Deploy to Production

# Runs only after "CI Code Protection" finishes on main, and deploys only
# when it succeeded. Never triggered by pull requests.
on:
  workflow_run:
    workflows: ["CI Code Protection"]
    types: [completed]
    branches: [main]

jobs:
  deploy-frontend:
    name: deploy-frontend (Vercel)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build for production
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  deploy-database:
    name: deploy-database (Supabase)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Direct connection (port 5432): migrations require it, the pooler
      # would break DDL. Password lives only in repository secrets.
      SUPABASE_DB_URL: postgresql://postgres:${{ secrets.SUPABASE_DB_PASSWORD }}@db.lgdxwbarmsmootifbcsp.supabase.co:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: supabase/setup-cli@v1
      - name: Check database connectivity
        run: psql "$SUPABASE_DB_URL" -c "select version();"
      - name: Apply pending migrations
        # Runs once the team adds SQL files under supabase/migrations/.
        if: hashFiles('supabase/migrations/*.sql') != ''
        run: supabase db push --db-url "$SUPABASE_DB_URL"
