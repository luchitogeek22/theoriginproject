services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: origin
      POSTGRES_PASSWORD: origin
      POSTGRES_DB: origin
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  backend:
    build: ./backend
    depends_on:
      - postgres
      - redis
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://origin:origin@postgres:5432/origin
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      LOCAL_STORAGE_DIR: /app/data/storage
    volumes:
      - backenddata:/app/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
  miniodata:
  backenddata:
