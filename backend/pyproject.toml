[project]
name = "origin-backend"
version = "0.1.0"
description = "THE ORIGIN PROJECT — scientific backend (FastAPI + Astropy)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: statistical tests with hundreds of trials; run in CI with -m 'slow or not slow'"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
